name: Code quality

on:
  push:
    branches: [ main ] # Adjust branches as needed
  pull_request:
    branches: [ main ] # Adjust branches as needed

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Biome
        uses: biomejs/setup-biome@f382a98e582959e6aaac8e5f8b17b31749018780 # v2.5.0
        with:
          # 与 package.json 中的 @biomejs/biome 保持一致，避免 CI 随 latest 漂移
          # （今天通过、明天新版本失败）导致不可复现的构建结果。
          version: 2.5.9
      - name: Run Biome
        run: biome ci ./src --reporter=github
